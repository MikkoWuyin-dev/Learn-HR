name: asset-pull
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/asset-pull.yml'
      - '.github/scripts/asset_pull.py'
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/arena/6bb52b11-learn-hr'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run asset discovery
        run: python3 .github/scripts/asset_pull.py
      - name: Publish captured assets to branch
        run: |
          set -e
          git config user.name "asset-pull bot"
          git config user.email "asset-pull@users.noreply.github.com"
          git add -A _assetpull
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "chore: captured ACNIRET assets"; fi
          git push origin HEAD:arena/6bb52b11-learn-hr
      - name: Print manifest
        run: cat _assetpull/manifest.tsv || true
