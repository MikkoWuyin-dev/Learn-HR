name: asset-pull
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/asset-pull.yml'
      - '.github/scripts/asset_pull2.py'
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/arena/6bb52b11-learn-hr'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run deep asset scan
        run: python3 .github/scripts/asset_pull2.py
      - name: Publish captures to branch
        run: |
          set -e
          git config user.name "asset-pull bot"
          git config user.email "asset-pull@users.noreply.github.com"
          git add -A _assetpull2
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "chore: captured ACNIRET assets (pass 2)"; fi
          git push origin HEAD:arena/6bb52b11-learn-hr
